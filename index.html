<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Asanoha</title>
</head>
<body>
    <button class="mode" type="button"><img src="./imgs/dark-mode.svg" alt="moon shaped icon"></button>
    <div class="side-section">
        <img class="side-section-img"src="./imgs/jason-leung-UMncYEfO9-U-unsplash.jpg" alt="Image containing a pattern of star-like shapes inside a circle, with colors gradating from dark blue to golden from top to bottom" width="40%" height="auto">
        <div class="side-section-header"><img class="logo" src="./imgs/asanoha.svg" alt="a four leafs logo" >ASANOHA</div>
        <div class="img-credit">
            Photo by 
            <a href="https://unsplash.com/@ninjason?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Jason Leung</a> 
            on 
            <a href="https://unsplash.com/photos/a-blue-and-white-abstract-background-with-circles-UMncYEfO9-U?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
        </div>
    </div>

    <div class="main-content">
        <div class="main-text">
            <p class="quote">“You can learn great things from your mistakes when you aren't busy denying them.”</p>
            <p class="author">— Stephen R. Covey</p>
        </div>
        <form action="" method="get">
            <div class="main-form-wrapper">
                <h2 class="form-header">Let's do this!</h2>
                <div class="form-note">Please complete all required (*) fields.</div>
                <section class="form-inputs">
                    <div>
                        <label for="first-name">FIRST NAME *</label>
                        <input type="text" name="first-name" id="first-name" minlength="2" maxlength="30" required>
                        <span></span>
                    </div>
                    
                    <div>
                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name" id="last-name" minlength="2" maxlength="30">
                        <span></span>
                    </div>

                    <div>
                        <label for="user-email">EMAIL *</label>
                        <input type="email" name="user-email" id="user-email" required placeholder="john123@gmail.com">
                        <span></span>
                    </div>
                    
                    <div>
                        <label for="user-phone">PHONE NUMBER *</label>
                        <input type="tel" inputmode="numeric" name="user-phone" id="user-phone" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" minlength="12" maxlength"12" placeholder="555-123-4567">
                        <span></span>
                    </div>

                    <div>
                        <label for="user-password">PASSWORD *</label>
                        <input type="password" name="user-password" id="user-password" required minlength="8" maxlength="20">
                        <span></span>

                    </div>
                    
                    <div>
                        <label for="confirm-password">CONFIRM PASSWORD *</label>
                        <input type="password" name="confirm-password" id="confirm-password" required minlength="8" maxlength="20">
                        <span></span>
                    </div>
                </section>
            </div>

            <section class="submit-btn">
                <div>
                    <button type="submit">Create Account</button>
                    <div class="log-in">Already have an account? <a href="">Log in</a> </div>
                </div>
        </form>

    </div>
</body>
</html>
